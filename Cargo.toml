[package]
name = "wistia-downloader"
version = "0.1.0"
edition = "2021"
description = "Wistia video and channel downloader with automatic resume"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
html-escape = "0.2"
indicatif = "0.17"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }

[profile.release]
lto = true
strip = true

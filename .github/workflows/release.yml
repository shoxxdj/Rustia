# .github/workflows/release.yml
#
# Tests, then builds x86_64 binaries for Linux, Windows and macOS on native GitHub runners.
# - Every run: binaries are available as workflow artifacts.
# - On a tag (e.g. v0.1.0): binaries are attached to a GitHub Release.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: wistia-downloader

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl # static binary, runs on any distro
            ext: ""
          - name: x86_64-windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: x86_64-macos
            os: macos-latest # Apple Silicon runner, cross-compiles to Intel with Xcode
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" \
             "dist/${BIN_NAME}-${{ matrix.name }}${{ matrix.ext }}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.name }}
          path: dist/*
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.BIN_NAME }} ${{ github.ref_name }}
          body: Prebuilt x86_64 binaries for Linux, Windows and macOS.
          files: dist/*

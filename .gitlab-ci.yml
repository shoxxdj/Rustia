# Builds x86_64 binaries for Linux, Windows and macOS from a Linux runner.
#
# - Linux:   x86_64-unknown-linux-musl  (static binary, runs on any distro)
# - Windows: x86_64-pc-windows-gnu      (MinGW-w64 cross-compiler)
# - macOS:   x86_64-apple-darwin        (cargo-zigbuild image, ships the macOS SDK)
#
# Every pipeline produces downloadable job artifacts. On a tag (e.g. v0.1.0) the binaries
# are also uploaded to the project's Generic Package Registry and attached to a Release.

stages:
  - test
  - build
  - release

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_TERM_COLOR: always
  BIN_NAME: wistia-downloader
  PACKAGE_REGISTRY_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BIN_NAME}

default:
  interruptible: true

.rust:
  image: rust:1-bookworm
  cache:
    key: cargo-${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

test:
  extends: .rust
  stage: test
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

.build:
  stage: build
  needs: [test]
  artifacts:
    name: ${BIN_NAME}-${CI_COMMIT_REF_SLUG}-${CI_JOB_NAME_SLUG}
    paths:
      - dist/
    expire_in: 30 days

build:linux-x86_64:
  extends: [.rust, .build]
  variables:
    TARGET: x86_64-unknown-linux-musl
  script:
    - apt-get update -qq && apt-get install -y -qq musl-tools
    - rustup target add ${TARGET}
    - cargo build --locked --release --target ${TARGET}
    - mkdir -p dist
    - cp target/${TARGET}/release/${BIN_NAME} dist/${BIN_NAME}-x86_64-linux
    - file dist/* || true

build:windows-x86_64:
  extends: [.rust, .build]
  variables:
    TARGET: x86_64-pc-windows-gnu
  script:
    - apt-get update -qq && apt-get install -y -qq gcc-mingw-w64-x86-64
    - rustup target add ${TARGET}
    - cargo build --locked --release --target ${TARGET}
    - mkdir -p dist
    - cp target/${TARGET}/release/${BIN_NAME}.exe dist/${BIN_NAME}-x86_64-windows.exe

build:macos-x86_64:
  extends: .build
  # Image maintained by the cargo-zigbuild project: Rust + Zig + macOS SDK.
  image: ghcr.io/rust-cross/cargo-zigbuild:latest
  variables:
    TARGET: x86_64-apple-darwin
  cache:
    key: cargo-${CI_JOB_NAME_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
  script:
    - rustup target add ${TARGET}
    - cargo zigbuild --locked --release --target ${TARGET}
    - mkdir -p dist
    - cp target/${TARGET}/release/${BIN_NAME} dist/${BIN_NAME}-x86_64-macos

# Alternative if you have GitLab-hosted macOS runners (Premium/Ultimate): native build,
# which also allows code signing. Replace build:macos-x86_64 with this job.
#
# build:macos-x86_64:
#   extends: .build
#   tags: [saas-macos-medium-m1]
#   image: macos-15-xcode-16
#   variables:
#     TARGET: x86_64-apple-darwin
#   script:
#     - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
#     - source "$HOME/.cargo/env"
#     - rustup target add ${TARGET}
#     - cargo build --locked --release --target ${TARGET}
#     - mkdir -p dist
#     - cp target/${TARGET}/release/${BIN_NAME} dist/${BIN_NAME}-x86_64-macos

upload:
  stage: release
  image: curlimages/curl:latest
  needs: [build:linux-x86_64, build:windows-x86_64, build:macos-x86_64]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for f in dist/*; do
        echo "Uploading $f"
        curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/$(basename "$f")"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [upload]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "${BIN_NAME} ${CI_COMMIT_TAG}"
    description: "Prebuilt x86_64 binaries for Linux, Windows and macOS."
    assets:
      links:
        - name: ${BIN_NAME}-x86_64-linux
          url: ${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${BIN_NAME}-x86_64-linux
          link_type: package
        - name: ${BIN_NAME}-x86_64-windows.exe
          url: ${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${BIN_NAME}-x86_64-windows.exe
          link_type: package
        - name: ${BIN_NAME}-x86_64-macos
          url: ${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/${BIN_NAME}-x86_64-macos
          link_type: package
